modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/yunfang1718128/entity-capture/issues"

[[mods]]
modId = "entity_capture"
version = "${version}"
displayName = "Entity Capture"
description = '''Capture any entity (including modded) into a native-resolution .mcvox voxel file for mc-block-studio.'''
authors = "yunfang"
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "entity-capture.mixins.json"

[[dependencies.entity_capture]]
	modId = "forge"
	mandatory = true
	versionRange = "[47,)"
	ordering = "NONE"
	side = "CLIENT"

[[dependencies.entity_capture]]
	modId = "minecraft"
	mandatory = true
	versionRange = "[1.20.1,1.20.2)"
	ordering = "NONE"
	side = "CLIENT"
